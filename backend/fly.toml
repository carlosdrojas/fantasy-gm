# fly.toml app configuration file generated for fantasy-gm-demo on 2026-10-08T04:13:34-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fantasy-gm-demo'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Past these, Fly queues or refuses requests instead of piling them on one small VM.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
